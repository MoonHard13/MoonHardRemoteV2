name: Registry Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/app/registry_*.py'
      - 'client/app/main.py'
      - 'dashboard/app/registry_dashboard_extension.py'
      - 'dashboard/app/views/manage/registry_*.py'
      - 'dashboard/app/views/manage/tab_navigation.py'
      - 'dashboard/app/main.py'
      - 'server/app/websocket/registry_*.py'
      - 'server/app/main.py'
      - 'tests/test_registry_feature.py'
      - '.github/workflows/registry-windows.yml'

permissions:
  contents: read

jobs:
  registry:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r dashboard/requirements.txt -r client/requirements.txt
      - name: Compile Registry modules
        shell: pwsh
        run: |
          python -m py_compile client/app/registry_service.py
          python -m py_compile client/app/registry_service_safe.py
          python -m py_compile client/app/registry_client_extension.py
          python -m py_compile server/app/websocket/registry_requests.py
          python -m py_compile server/app/websocket/registry_extension.py
          python -m py_compile dashboard/app/registry_dashboard_extension.py
          python -m py_compile dashboard/app/views/manage/registry_tab.py
          python -m py_compile dashboard/app/views/manage/registry_regedit_tab.py
          python -m py_compile dashboard/app/views/manage/registry_ergonomic_tab.py
          python -m py_compile dashboard/app/views/manage/tab_navigation.py
      - name: Run Registry unit and HKCU integration tests
        run: python -m unittest tests.test_registry_feature -v
