name: Provider Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/app/provider_dashboard_extension.py'
      - 'dashboard/app/views/manage/provider_*.py'
      - 'dashboard/app/main.py'
      - 'tests/test_provider_ui_ergonomics.py'
      - '.github/workflows/provider-windows.yml'

permissions:
  contents: read

jobs:
  provider:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dashboard dependencies
        run: python -m pip install -r dashboard/requirements.txt
      - name: Compile Provider UI modules
        shell: pwsh
        run: |
          python -m py_compile dashboard/app/views/manage/provider_tab.py
          python -m py_compile dashboard/app/views/manage/provider_transmitted_window.py
          python -m py_compile dashboard/app/views/manage/provider_ergonomic_tab.py
          python -m py_compile dashboard/app/provider_dashboard_extension.py
          python -m py_compile dashboard/app/main.py
      - name: Run Provider ergonomic UI tests
        run: python -m unittest tests.test_provider_ui_ergonomics -v
