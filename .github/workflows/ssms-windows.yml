name: SSMS Windows validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/app/**'
      - 'dashboard/requirements.txt'
      - 'client/app/sql*'
      - 'client/app/client_agent.py'
      - 'client/app/main.py'
      - 'server/app/routes/websocket_routes.py'
      - 'server/app/websocket/sql_responses.py'
      - 'tests/test_sql_execution.py'
      - 'tests/test_ssms.py'
      - 'scripts/*ssms*'
      - 'scripts/build_dashboard_exe.ps1'
      - '.github/workflows/ssms-windows.yml'

permissions:
  contents: read

jobs:
  ssms:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and build dependencies
        run: python -m pip install -r dashboard/requirements.txt -r client/requirements.txt pyinstaller
      - name: Test SSMS and EXE in a clean directory
        shell: pwsh
        run: ./scripts/validate_ssms_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MoonHard-SSMS-Windows
          path: |
            dist/MoonHardRemoteDashboard.exe
            dist/MoonHardRemoteSSMS.exe
            dist/ssms-smoke.json
            dist/ssms-preview.png
            dist/MoonHardRemoteClient/
            dist/sql-client-smoke.json
